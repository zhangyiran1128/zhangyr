name: vhcmusic
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - numpy
  - scipy
  - pandas
  - pyyaml
  - tqdm
  - matplotlib
  - seaborn
  - scikit-learn
  - pytorch>=2.4
  - torchaudio
  - pytorch-cuda=11.8
  - pip:
      - omegaconf>=2.3
      - jsonschema>=4.17
      - mido>=1.3
      - miditoolkit>=0.1.16
      - pretty_midi>=0.2.10
      - librosa>=0.10.2,<0.12
      - soundfile>=0.12
      - pyloudnorm>=0.1.1
      - mir_eval>=0.7
      - pytest>=7.0
